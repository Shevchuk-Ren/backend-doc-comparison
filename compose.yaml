services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db: 
        condition: service_healthy

    restart: unless-stopped
    volumes:
      - .:/backend

  db:
    image: postgres:16-alpine
    env_file:
      - .env
  
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    
volumes:
  postgres_data: